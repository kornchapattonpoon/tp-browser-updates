<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<title>Neon Snake</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b1a; color: #fff; touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  #top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 18px;
    font-weight: 700; font-size: 17px; letter-spacing: .02em; }
  #top span { padding: 6px 14px; border-radius: 16px; background: rgba(255,255,255,.08); }
  canvas { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(120,255,220,.25), 0 0 40px rgba(80,220,255,.18); }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
  #msg div { padding: 24px 22px; border-radius: 26px; background: rgba(20,20,45,.82); backdrop-filter: blur(10px); max-width: 340px; }
  #msg h1 { margin: 0 0 6px; font-size: 32px; background: linear-gradient(90deg,#6effd8,#7aa8ff,#d48cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #msg p { margin: 6px 0 16px; color: #c9c8e6; line-height: 1.4; }
  #msg button { width: 100%; height: 48px; border: 0; border-radius: 24px; font: 700 17px inherit; font-family: inherit; color: #0b0b1a;
    background: linear-gradient(90deg,#6effd8,#7aa8ff); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="top"><span>🍎 <b id="score">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c"></canvas>
<div id="msg"><div><h1>Neon Snake</h1><p id="msg-text">Swipe to steer (or use the arrow keys). Eat the glowing dots, don’t bite your tail.</p><button id="go">Play</button></div></div>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('c'), x = cv.getContext('2d');
  const N = 18; // grid size
  let cell = 20, snake, dir, next, food, score, best = 0, timer = 0, speed, alive = false, last = 0, trail = [];
  try { best = Number(localStorage.getItem('neonsnake:best')) || 0; } catch (e) {}
  document.getElementById('best').textContent = best;
  function size() {
    const s = Math.min(innerWidth - 24, innerHeight - 140, 560);
    cell = Math.floor(s / N);
    const px = cell * N, dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = px * dpr; cv.height = px * dpr; cv.style.width = px + 'px'; cv.style.height = px + 'px';
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', size); size();
  function place() {
    let p;
    do { p = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; } while (snake.some((s) => s.x === p.x && s.y === p.y));
    food = p;
  }
  function start() {
    snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
    dir = { x: 1, y: 0 }; next = dir; score = 0; speed = 140; alive = true; trail = [];
    document.getElementById('score').textContent = '0';
    document.getElementById('msg').hidden = true;
    place();
  }
  function turn(dx, dy) {
    if (!alive) return;
    if (dx === -dir.x && dy === -dir.y) return;
    next = { x: dx, y: dy };
  }
  function step() {
    dir = next;
    const h = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };
    if (snake.some((s, i) => i < snake.length - 1 && s.x === h.x && s.y === h.y)) return over();
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) {
      score++; document.getElementById('score').textContent = score;
      speed = Math.max(70, speed - 3);
      for (let i = 0; i < 10; i++) trail.push({ x: (h.x + .5) * cell, y: (h.y + .5) * cell, vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5, life: 1 });
      try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
      place();
    } else snake.pop();
  }
  function over() {
    alive = false;
    if (score > best) { best = score; try { localStorage.setItem('neonsnake:best', String(best)); } catch (e) {} }
    document.getElementById('best').textContent = best;
    document.getElementById('msg-text').textContent = 'You ate ' + score + (score === 1 ? ' dot.' : ' dots.') + (score >= best && score > 0 ? ' New best! 🏆' : ' Best: ' + best + '.');
    document.getElementById('go').textContent = 'Play again';
    document.getElementById('msg').hidden = false;
  }
  function draw(t) {
    const s = cell * N;
    x.clearRect(0, 0, s, s);
    x.fillStyle = '#111129'; x.fillRect(0, 0, s, s);
    x.strokeStyle = 'rgba(255,255,255,.04)';
    for (let i = 1; i < N; i++) { x.beginPath(); x.moveTo(i * cell, 0); x.lineTo(i * cell, s); x.moveTo(0, i * cell); x.lineTo(s, i * cell); x.stroke(); }
    if (!snake) return;
    const pulse = 0.6 + 0.4 * Math.sin(t / 180);
    x.shadowBlur = 18; x.shadowColor = '#ff7ad9';
    x.fillStyle = 'rgba(255,122,217,' + (0.7 + 0.3 * pulse) + ')';
    x.beginPath(); x.arc((food.x + .5) * cell, (food.y + .5) * cell, cell * (0.28 + 0.06 * pulse), 0, 7); x.fill();
    snake.forEach((p, i) => {
      const k = 1 - i / (snake.length + 6);
      x.shadowColor = '#6effd8'; x.shadowBlur = i ? 8 : 20;
      x.fillStyle = 'hsl(' + (165 + i * 4) + ',100%,' + (55 + 20 * k) + '%)';
      const pad = i ? cell * 0.14 : cell * 0.06, r = cell * 0.3;
      const X = p.x * cell + pad, Y = p.y * cell + pad, w = cell - pad * 2;
      x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + w, r); x.arcTo(X + w, Y + w, X, Y + w, r); x.arcTo(X, Y + w, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.fill();
    });
    x.shadowBlur = 0;
    trail = trail.filter((p) => (p.life -= 0.03) > 0);
    trail.forEach((p) => { p.x += p.vx; p.y += p.vy; x.fillStyle = 'rgba(255,160,230,' + p.life + ')'; x.fillRect(p.x, p.y, 3, 3); });
  }
  function loop(t) {
    if (alive) { timer += t - last; while (timer > speed && alive) { timer -= speed; step(); } }
    last = t; draw(t); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  let sx = 0, sy = 0, tracking = false;
  addEventListener('touchstart', (e) => { if (e.target.tagName === 'BUTTON') return; e.preventDefault(); const t = e.touches[0]; sx = t.clientX; sy = t.clientY; tracking = true; }, { passive: false });
  addEventListener('touchmove', (e) => {
    if (!tracking) return; e.preventDefault();
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
    sx = t.clientX; sy = t.clientY;
  }, { passive: false });
  addEventListener('touchend', () => { tracking = false; });
  addEventListener('keydown', (e) => {
    const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0] }[e.code];
    if (k) { e.preventDefault(); turn(k[0], k[1]); }
    if ((e.code === 'Space' || e.code === 'Enter') && !alive) start();
  });
  document.getElementById('go').addEventListener('click', start);
})();
</script>
</body>
</html>
